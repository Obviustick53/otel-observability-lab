extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:ENVIRONMENT}
        action: upsert
      - key: service.namespace
        value: otel-lab
        action: upsert
      - key: telemetry.scope
        value: local
        action: upsert
      - key: cloud.provider
        value: local
        action: upsert
      - key: cloud.region
        value: local
        action: upsert
      - key: observability.source
        value: otel-collector
        action: upsert
  transform/metric_metadata:
    metric_statements:
      - context: metric
        statements:
          - set(description, "Total de solicitudes procesadas por las aplicaciones") where name == "app_requests"
          - set(description, "Latencia de solicitudes de las aplicaciones") where name == "app_request_duration_seconds"
          - set(description, "Solicitudes activas en las aplicaciones") where name == "app_active_requests"
          - set(description, "Latencia de consultas PostgreSQL en las aplicaciones") where name == "app_db_duration_seconds"
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/metric_metadata, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [loki, debug]
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
