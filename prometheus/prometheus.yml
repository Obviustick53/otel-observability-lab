global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    telemetry_scope: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: local-security-simulator
    scrape_interval: 15s
    static_configs:
      - targets: [local-security-simulator:9464]
