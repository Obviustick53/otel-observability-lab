AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Red de sandbox AWS para OTEL Lab. Fargate usa subredes publicas sin NAT para
  mantener bajo el costo; RDS queda aislado en subredes privadas.

Parameters:
  ProjectName:
    Type: String
    Default: otel-lab
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,19}$'
  Environment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, dev, test]
  Owner:
    Type: String
    Default: observability-lab
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,31}$'
  ExpirationUtc:
    Type: String
    Default: '2026-09-30'
    AllowedPattern: '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$'
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
  PublicSubnet1Cidr:
    Type: String
    Default: 10.42.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.42.2.0/24
  PrivateDbSubnet1Cidr:
    Type: String
    Default: 10.42.11.0/24
  PrivateDbSubnet2Cidr:
    Type: String
    Default: 10.42.12.0/24
  AllowedIngressCidr:
    Type: String
    Default: 203.0.113.0/32
    Description: CIDR autorizado para el endpoint publico de service-a; reemplazar por una IP /32 controlada.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
  AllowLegacyDirectDbAccess:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Solo para compatibilidad temporal con imagenes actuales que acceden a RDS
      directamente desde service-a/service-b. Por defecto false para cumplir
      el aislamiento data-service -> RDS.

Conditions:
  LegacyDirectDbAccessEnabled: !Equals [!Ref AllowLegacyDirectDbAccess, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PrivateDbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-db-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-1'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-2'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  PrivateDbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateDbSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-db-1'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  PrivateDbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateDbSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-db-2'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateDbSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateDbRouteTable
      SubnetId: !Ref PrivateDbSubnet1

  PrivateDbSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateDbRouteTable
      SubnetId: !Ref PrivateDbSubnet2

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS service-a/service-b east-west traffic
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-application-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  DataServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS data-service traffic and RDS client
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-data-service-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  CollectorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private OTLP ingress to the ECS collector
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-collector-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private PostgreSQL ingress only from data-service
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-rds-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ExpiresOn
          Value: !Ref ExpirationUtc

  ApplicationIngressFromAllowedCidr:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ApplicationSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Ref AllowedIngressCidr
      Description: Restricted smoke access to service-a

  ApplicationIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ApplicationSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8002
      SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      Description: Service Connect application traffic

  DataServiceIngressFromApplications:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DataServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 8002
      ToPort: 8002
      SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      Description: Application calls to data-service

  CollectorIngressFromApplications:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CollectorSecurityGroup
      IpProtocol: tcp
      FromPort: 4317
      ToPort: 4317
      SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      Description: OTLP gRPC from application tasks

  CollectorIngressFromDataService:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CollectorSecurityGroup
      IpProtocol: tcp
      FromPort: 4317
      ToPort: 4317
      SourceSecurityGroupId: !Ref DataServiceSecurityGroup
      Description: OTLP gRPC from data-service task

  RdsIngressFromDataService:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DataServiceSecurityGroup
      Description: PostgreSQL from data-service only

  LegacyRdsIngressFromApplications:
    Condition: LegacyDirectDbAccessEnabled
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      Description: Explicit compatibility exception for current service images

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub '${ProjectName}-${Environment}-VpcId'
  PublicSubnet1Id:
    Description: Public Fargate subnet 1
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PublicSubnet1Id'
  PublicSubnet2Id:
    Description: Public Fargate subnet 2
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PublicSubnet2Id'
  PrivateDbSubnet1Id:
    Description: Private RDS subnet 1
    Value: !Ref PrivateDbSubnet1
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PrivateDbSubnet1Id'
  PrivateDbSubnet2Id:
    Description: Private RDS subnet 2
    Value: !Ref PrivateDbSubnet2
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PrivateDbSubnet2Id'
  ApplicationSecurityGroupId:
    Description: Application security group
    Value: !Ref ApplicationSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ApplicationSecurityGroupId'
  DataServiceSecurityGroupId:
    Description: data-service security group
    Value: !Ref DataServiceSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DataServiceSecurityGroupId'
  CollectorSecurityGroupId:
    Description: Collector security group
    Value: !Ref CollectorSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-CollectorSecurityGroupId'
  RdsSecurityGroupId:
    Description: RDS security group
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecurityGroupId'
